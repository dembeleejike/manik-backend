name: Daily backup

on:
  schedule:
    # Runs once a day at 3:00 AM UTC. Adjust the hour if you want it to
    # run at a different time — cron times here are always in UTC.
    - cron: "0 3 * * *"
  workflow_dispatch: # lets you trigger a backup manually from the Actions tab

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the backup
        run: |
          curl -s -X POST https://manik-backend-re8v.onrender.com/api/backup/run \
            -H "x-backup-secret: ${{ secrets.BACKUP_SECRET }}" \
            -w "\nStatus: %{http_code}\n"
